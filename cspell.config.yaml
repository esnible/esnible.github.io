  # @cspell/dict-fr-fr` and the matching entries in `import:` below. Coin legends
  # in this corpus are Mughal-era Perso-Arabic, so both Arabic dictionaries are
  # needed: Modern Standard Arabic (`ar`) does not cover Persian vocabulary or
  # Persian letterforms (KEHEH ک, FARSI YEH ی) used alongside standard Arabic
  # letters in the same legend. `fr-fr` covers the French passages that recur in
  # ONS newsletters (regional-secretary notices, French book titles).
